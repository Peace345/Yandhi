<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yandhi</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: white;
      text-align: center;
    }

    #player {
      padding: 20px;
    }

    #cover {
      width: 250px;
      height: 250px;
      object-fit: cover;
      margin-top: 10px;
      border-radius: 10px;
    }

    .song {
      padding: 10px;
      margin: 5px auto;
      width: 60%;
      background: #222;
      cursor: pointer;
      border-radius: 5px;
    }

    .song:hover {
      background: #333;
    }

    button {
      margin: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="player">

  <!-- BACK BUTTON -->
  <button onclick="goBack()">⬅ Back to Library</button>

  <!-- ALBUM INFO -->
  <h1 id="albumTitle">Album Title</h1>
  <img id="cover" src="" alt="cover">

  <!-- SONG LIST -->
  <div id="songs"></div>

</div>

<audio id="audio"></audio>

<button id="playPauseBtn" onclick="togglePlay()">▶️ Play</button>

<script>

let currentAlbum = {
  name: "Yandhi",
  cover: "yandhicover.jpg",
  songs: [
      { file: "selah.mp3", title: "Selah", artist: "Kanye West" },
      { file: "chakras.mp3", title: "Chakras", artist: "Kanye West, The-Dream, Ant Clemons, Bongo ByTheWay" },
      { file: "calm before the storm.mp3", title: "Calm Before The Storm", artist: "Kanye West, Ty Dolla $ign" },
      { file: "thestorm.mp3", title: "The Storm", artist: "Kanye West, Ty Dolla $ign, Kid Cudi, XXXTENTACION" },
      { file: "spreadyourwings.mp3", title: "Spread Your Wings", artist: "Kanye West" },
      { file: "newbody.mp3", title: "New Body", artist: "Kanye West, Nicki Minaj, Ty Dolla $ign" },
      {
        title: "80 Degrees",
        versions: [
      {
        version: "V8",
        file: "80degreesv8.mp3",
        artist: "Kanye West, Ant Clemons, Big Sean, Ty Dolla $ign"
      },
      {
        version: "V3",
        file: "80degrees.mp3",
        artist: "Kanye West, Ant Clemons"
      }
    ]
  },
      { file: "cityinthesky.mp3", title: "City In The Sky", artist: "Kanye West, Desiigner, Jeremih, Kid Cudi, The-Dream, Ty Dolla $ign, 070 Shake" },
      { file: "alieninterlude.mp3", title: "Alien (Interlude)", artist: "Kanye West" },
      { file: "alien.mp3", title: "Alien", artist: "Kanye West, Quavo, Kid Cudi, Young Thug, Ant Clemons" },
      { file: "brothers.mp3", title: "Brothers", artist: "Kanye West, Charlie Wilson" },
      { file: "cashtoburn.mp3", title: "Cash To Burn", artist: "Kanye West, Ant Clemons, Styles P, Kenny G" },
      {
        title: "Law Of Attraction",
        versions: [
      {
        version: "V7",
        file: "lawofattractionv7.mp3",
        artist: "Kanye West, Ant Clemons, Clipse, Kenny G, Nino Blu"
      },
      {
        version: "V2",
        file: "lawofattraction.mp3",
        artist: "Kanye West, Ant Clemons, Clipse, Kenny G"
      }
    ]
  },
      { file: "ongod.mp3", title: "On God", artist: "Kanye West, Dua Lipa" },
      { file: "thegarden.mp3", title: "The Garden", artist: "Kanye West, Ant Clemons, Ty Dolla $ign, Teyana Taylor" },
      { file: "lastname.mp3", title: "Last Name", artist: "Kanye West, Ant Clemons" },
      { file: "home.mp3", title: "Home", artist: "Kanye West, Ant Clemons" },
      { file: "endofit.mp3", title: "End Of It", artist: "Kanye West" },
      { file: "dontget2excited.mp3", title: "Don't Get 2 Excited", artist: "Kanye West" },
      { file: "byebyebaby.mp3", title: "Bye Bye Baby", artist: "Kanye West, Mykki Blanco" },
      { file: "wegotlove.mp3", title: "We Got Love", artist: "Kanye West, Teyana Taylor" },
      { file: "noproblem.mp3", title: "No Problem", artist: "Kanye West, Smokepurpp" },
      { file: "jam15.mp3", title: "Jam15", artist: "Kanye West, Chief Keef" },
      { file: "jam16.mp3", title: "Jam16", artist: "Kanye West" },
      { file: "ikillforfun.mp3", title: "I Kill For Fun", artist: "Kanye West, YNW Melly" },
      { file: "cubanlink.mp3", title: "Cuban Link", artist: "Kanye West" },
      { file: "survive.mp3", title: "Survive", artist: "Kanye West, Tee Grizzley" },
      { file: "houseparty.mp3", title: "House Party", artist: "Kanye West, Ant Clemons" },
      { file: "heavencalls.mp3", title: "Heaven Calls", artist: "Kanye West, Ant Clemons" },
      { file: "oneminutev3.mp3", title: "One Minute", artist: "Kanye West, XXXTENTACION, Tony Williams" }
  ]
};

// BACK BUTTON (PUT MAIN REPO LINK HERE)
function goBack() {
  window.location.href = "https://peace345.github.io/Ye-Unreleased-Archive/"; // <-- paste main library repo URL here
}

// LOAD ALBUM
document.getElementById("albumTitle").innerText = currentAlbum.name;
document.getElementById("cover").src = currentAlbum.cover;

buildSongs();

// BUILD SONG LIST
function buildSongs() {
  const songsDiv = document.getElementById("songs");
  songsDiv.innerHTML = "";

  currentAlbum.songs.forEach((song, i) => {

    // SONG WITH MULTIPLE VERSIONS
    if (song.versions) {

      const group = document.createElement("div");
      group.className = "song";

      group.innerHTML = `<strong>${song.title} ▼</strong>`;

      group.onclick = () => {

        // prevent duplicates
        if (group.dataset.opened) return;
        group.dataset.opened = true;

        song.versions.forEach(version => {

          const div = document.createElement("div");
          div.className = "song";

          div.innerHTML = `
            <div style="display:flex; align-items:center;">
              <div style="width:60px;">
                <strong>${version.version}</strong>
              </div>

              <div style="flex:1; text-align:center;">
                <strong>${song.title}</strong><br>
                <small>${version.artist}</small>
              </div>
            </div>
          `;

          div.onclick = (e) => {
            e.stopPropagation();

            window.audio.src = version.file;
            window.audio.play();

            updateMediaSession({
              title: song.title,
              artist: version.artist
            });
          };

          group.after(div);

        });

      };

      songsDiv.appendChild(group);

    }

    // NORMAL SONG
    else {

      const div = document.createElement("div");
      div.className = "song";

      div.innerHTML = `
        <strong>${song.title}</strong><br>
        <small>${song.artist || ""}</small>
      `;

      div.onclick = () => playSong(i);

      songsDiv.appendChild(div);

    }

  });

}

// PLAY SONG
function playSong(i) {

  // Skip version groups
  while (
    i < currentAlbum.songs.length &&
    currentAlbum.songs[i].versions
  ) {
    i++;
  }

  // Loop back to beginning if needed
  if (i >= currentAlbum.songs.length) {
    i = 0;

    while (
      i < currentAlbum.songs.length &&
      currentAlbum.songs[i].versions
    ) {
      i++;
    }
  }

  currentIndex = i;

  const song = currentAlbum.songs[i];

  window.audio.src = song.file;
  window.audio.play();

  updateMediaSession(song, currentAlbum);
}

function updateMediaSession(song) {
  if (!('mediaSession' in navigator)) return;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: song.artist,
    album: currentAlbum.name,
    artwork: [
      { src: currentAlbum.cover, sizes: "512x512", type: "image/jpg" }
    ]
  });

  navigator.mediaSession.setActionHandler("play", () => {
    audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    audio.pause();
  });

  navigator.mediaSession.setActionHandler("previoustrack", () => {
    if (!currentAlbum) return;
    currentIndex = (currentIndex - 1 + currentAlbum.songs.length) % currentAlbum.songs.length;
    playSong(currentIndex);
  });

  navigator.mediaSession.setActionHandler("nexttrack", () => {
    if (!currentAlbum) return;
    currentIndex = (currentIndex + 1) % currentAlbum.songs.length;
    playSong(currentIndex);
  });
}

  if ("mediaSession" in navigator) {

  navigator.mediaSession.setActionHandler("play", async () => {
    await audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    audio.pause();
  });

}

function togglePlay() {
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}

  audio.addEventListener("play", () => {
  document.getElementById("playPauseBtn").innerText = "⏸️ Pause";
});

audio.addEventListener("pause", () => {
  document.getElementById("playPauseBtn").innerText = "▶️ Play";
});

window.addEventListener("DOMContentLoaded", () => {

  const audio = document.getElementById("audio");

  audio.addEventListener("ended", () => {
  if (!currentAlbum) return;

  const list = getPlayableSongs();

  const currentSong = currentAlbum.songs[currentIndex];
  const nextIndex = list.indexOf(currentSong) + 1;

  if (nextIndex < list.length) {
    const nextSong = list[nextIndex];

    const realIndex = currentAlbum.songs.indexOf(nextSong);
    playSong(realIndex);
  } else {
    playSong(currentAlbum.songs.indexOf(list[0]));
  }
});

  // expose audio globally so playSong can use it safely
  window.audio = audio;
});

function getPlayableSongs() {
  const list = [];

  currentAlbum.songs.forEach(song => {
    if (song.versions) {
      // skip the container entirely
      return;
    }
    list.push(song);
  });

  return list;
}
  
</script>

</body>
</html>
